<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- 动态渐变光球背景层 -->
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
    <video id="wallVideo" class="wall-video" muted loop playsinline preload="none"></video>
    <span class="wall-dim" aria-hidden="true"></span>
  </div>

  <button class="theme-toggle wallpaper-toggle" id="wallpaperToggle" title="壁纸设置">
    <svg class="icon-wall" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 15-5-5-8.5 8.5"/></svg>
  </button>
  <button class="theme-toggle" id="themeToggle" title="切换明暗主题">
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <!-- 壁纸设置面板 -->
  <div class="wallpaper-panel hidden" id="wallpaperPanel">
    <div class="wp-title">壁纸设置</div>
    <div class="wp-grid" id="wallpaperOptions"></div>
    <div class="wp-divider"></div>
    <button class="wp-btn" id="wpPickImage">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      从本机选择图片
    </button>
    <button class="wp-btn" id="wpPickVideo">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
      选择本地视频（mp4 / webm）
    </button>
    <button class="wp-btn" id="wpClear">恢复默认壁纸</button>
    <div class="wp-row wp-dim-row">
      <span class="wp-dim-label">背景压暗</span>
      <input type="range" id="wpDim" min="0" max="70" value="0" />
      <span class="wp-dim-val" id="wpDimVal">0%</span>
    </div>
    <div class="wp-hint" id="wpHint">图片会压缩保存到浏览器本地；视频通过文件授权直接播放，无需复制大文件，重开新标签页自动恢复。</div>
  </div>

  <input type="file" id="wallpaperFile" accept="image/*" hidden />
  <input type="file" id="wallpaperVideoFile" accept="video/mp4,video/webm,video/quicktime,video/x-matroska" hidden />

  <div class="container">
    <div class="time-area">
      <div class="greeting" id="greeting">早上好</div>
      <div class="time" id="timeDisplay">00:00</div>
      <div class="date" id="dateDisplay">8月22日 周五</div>
    </div>

    <div class="search-area">
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索或输入网址..." autocomplete="off" />
      </div>
    </div>

    <div class="toolbar">
      <button class="btn-import" id="btnImport">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        从收藏夹导入
      </button>
    </div>

    <div class="grid" id="iconGrid"></div>

    <button class="card-add" id="btnAdd" title="添加链接">
      <div class="plus">+</div>
      <span class="add-text">添加</span>
    </button>
  </div>

  <!-- 添加/编辑弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 class="modal-title" id="modalTitle">添加链接</h2>
      <div class="modal-field">
        <label for="linkName">名称</label>
        <input type="text" id="linkName" placeholder="网站名称" autocomplete="off" />
      </div>
      <div class="modal-field">
        <label for="linkUrl">网址</label>
        <input type="text" id="linkUrl" placeholder="https://example.com" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="btnCancel">取消</button>
        <button class="btn btn-save" id="btnSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 导入弹窗 -->
  <div class="modal-overlay" id="importOverlay">
    <div class="modal modal-import">
      <div class="modal-header">
        <h2 class="modal-title">从收藏夹导入</h2>
        <div class="import-actions-top">
          <button class="btn btn-sm" id="btnSelectAll">全选</button>
          <span class="import-count" id="importCount"></span>
        </div>
      </div>
      <div class="import-list" id="importList"></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="btnImportCancel">取消</button>
        <button class="btn btn-save" id="btnImportConfirm">导入选中</button>
      </div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="contextMenu">
    <div class="context-item" data-action="edit">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      编辑
    </div>
    <div class="context-item context-item-danger" data-action="delete">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      删除
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
