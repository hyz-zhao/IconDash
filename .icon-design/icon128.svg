<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1d36"/>
      <stop offset="1" stop-color="#0e1022"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f08850"/>
      <stop offset="1" stop-color="#f0b860"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <!-- 底色 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <!-- 面板投影 -->
  <rect x="34" y="38" width="60" height="60" rx="15" fill="#000" opacity="0.45" filter="url(#soft)"/>
  <!-- 仪表盘面板 -->
  <rect x="34" y="34" width="60" height="60" rx="15" fill="#ffffff"/>
  <!-- 四宫格磁贴：一枚品牌渐变，其余暖白灰 -->
  <rect x="43" y="43" width="20" height="20" rx="7" fill="url(#tile)"/>
  <rect x="65" y="43" width="20" height="20" rx="7" fill="#ece7de"/>
  <rect x="43" y="65" width="20" height="20" rx="7" fill="#ece7de"/>
  <rect x="65" y="65" width="20" height="20" rx="7" fill="#ece7de"/>
</svg>
